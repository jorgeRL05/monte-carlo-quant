[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "mcquant"
version = "0.3.0"
description = "Métodos de Monte Carlo en finanzas cuantitativas: GBM, valoración de opciones y riesgo."
readme = "README.md"
requires-python = ">=3.12"
license = { text = "MIT" }
authors = [{ name = "Jorge Rodríguez Lázaro" }]
keywords = ["monte-carlo", "quantitative-finance", "option-pricing", "black-scholes", "gbm"]
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: MIT License",
    "Topic :: Office/Business :: Financial :: Investment",
    "Intended Audience :: Science/Research",
]
dependencies = ["numpy>=1.24", "scipy>=1.10"]

[project.optional-dependencies]
dev = ["pytest>=7.0", "pytest-cov>=4.0", "ruff>=0.4", "mypy>=1.10"]
viz = ["matplotlib>=3.7"]
data = ["pandas>=2.0", "yfinance>=0.2"]
notebooks = ["jupyter>=1.0", "matplotlib>=3.7", "pandas>=2.0", "yfinance>=0.2"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
target-version = "py312"
line-length = 100
exclude = ["notebooks", "venv", ".venv"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-v --tb=short"

[tool.mypy]
python_version = "3.12"
warn_return_any = true
warn_unused_configs = true
ignore_missing_imports = true

[tool.coverage.run]
source = ["mcquant"]

[tool.coverage.report]
show_missing = true
